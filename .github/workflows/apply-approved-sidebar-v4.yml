name: Apply approved 236px sidebar design

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply approved sidebar spec
        run: python .github/scripts/apply_approved_sidebar_v4.py
      - name: Commit approved sidebar
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html sw.js
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Implement approved 236px NextPlan sidebar"
          git push

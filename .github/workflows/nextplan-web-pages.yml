name: NextPlan Web Canonical Sync and Pages Deployment

on:
  push:
    branches: [main, 'fix/web-read-canonical-state-20261009']
    paths:
      - 'index.html'
      - 'sw.js'
      - 'current-action.js'
      - 'apple-web-v1.css'
      - 'jarvis.html'
      - 'jarvis.css'
      - 'jarvis-client.js'
      - 'jarvis-local.js'
      - 'jarvis-free-remote.js'
      - 'jarvis-bridge-ui.js'
      - 'jarvis-voice.js'
      - 'jarvis-memory-ui.js'
      - 'scripts/check_sync_contract.py'
      - '.github/workflows/nextplan-web-pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: nextplan-web-pages
  cancel-in-progress: false

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check canonical sync contract and inline JavaScript syntax
        run: python3 scripts/check_sync_contract.py

  deploy:
    if: github.ref == 'refs/heads/main'
    needs: verify
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - name: Prepare deployment
        run: |
          mkdir -p site
          cp index.html sw.js current-action.js apple-web-v1.css icon.svg manifest.webmanifest jarvis.html jarvis.css jarvis-client.js jarvis-local.js jarvis-free-remote.js jarvis-bridge-ui.js jarvis-voice.js jarvis-memory-ui.js site/
          touch site/.nojekyll
      - uses: actions/upload-pages-artifact@v4
        with:
          path: site
      - id: deployment
        uses: actions/deploy-pages@v4

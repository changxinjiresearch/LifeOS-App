name: Retarget v014 UI simple

on:
  push:
    branches:
      - final-windows-v013-comprehensive
    paths:
      - .github/workflows/retarget-v014-ui-simple.yml

permissions:
  contents: write

jobs:
  retarget:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: final-windows-v013-comprehensive
          fetch-depth: 0
      - name: Retarget release workflow
        run: |
          sed -i "s/140df66e9582ab98894fd8d9a368d8ca4630f6c8/2a9c4a6e408320f52321163e132773763bf10793/g" .github/workflows/rescue-windows-v014-final.yml
          grep -q "UI_REF: '2a9c4a6e408320f52321163e132773763bf10793'" .github/workflows/rescue-windows-v014-final.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .github/workflows/rescue-windows-v014-final.yml
          git diff --cached --check
          git commit -m 'Pin v0.1.4 to repaired canonical UI'
          git push origin HEAD:final-windows-v013-comprehensive

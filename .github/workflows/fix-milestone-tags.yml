name: Fix milestone tag layout

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch milestone tag layout
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          css_old=".list-meta{font-size:12px;color:var(--muted);text-align:right}.task-grid"
          css_new=".list-meta{font-size:12px;color:var(--muted);text-align:right}.milestone-tags{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px;line-height:1}.milestone-tags .priority{display:inline-flex;align-items:center;line-height:1.25;margin:0!important;padding:5px 8px;white-space:normal;vertical-align:middle}.task-grid"
          if css_old not in s:
              raise SystemExit('CSS anchor not found')
          s=s.replace(css_old,css_new,1)
          html_old='<div class="list-sub" style="margin-top:7px">${(p.milestones||[]).map(m=>`<span class="priority" style="margin-right:4px">${statusLabel(m.status)} · ${esc(m.name)}</span>`).join(\' \')}</div>'
          html_new='<div class="milestone-tags">${(p.milestones||[]).map(m=>`<span class="priority">${statusLabel(m.status)} · ${esc(m.name)}</span>`).join(\'\')}</div>'
          if html_old not in s:
              raise SystemExit('Milestone HTML anchor not found')
          s=s.replace(html_old,html_new,1)
          p.write_text(s,encoding='utf-8')
          PY
      - name: Commit fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Fix overlapping milestone tags"
          git push

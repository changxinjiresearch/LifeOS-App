name: NextPlan Windows v0.1.3 Comprehensive Final Acceptance

on:
  push:
    branches: [final-windows-v013-comprehensive]
    paths:
      - '.github/workflows/windows-v013-comprehensive-final.yml'
      - 'scripts/windows_final_*.js'
  workflow_dispatch:

permissions:
  actions: read
  contents: read

env:
  FINAL_RUN_ID: '34770165887'
  V012_RUN_ID: '34765642458'
  OFFICIAL_EXTENSION_ID: 'gbdcbnbdmkgjffjioohjfidjmchiggpc'
  EXPECTED_INSTALLER_SHA: '5547cb8abd7914c9ff9e8230b91763e49e4395776fc577e62dd05e9c32443dbf'
  EXPECTED_BRIDGE_SHA: 'b2e04bf444d2b8a97a6ec5ee538d0063775fe34594b647098215b4812469534b'
  EXPECTED_UI_SHA: 'b1765641ad11d545e17e46d07e53dfc5fdd9e0756c79d82d803beeac2bb88d59'

jobs:
  final-windows-acceptance:
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install acceptance-only JS runtime dependency
        shell: pwsh
        run: npm install --no-save jsdom@24

      - name: Download exact v0.1.3 user release
        uses: actions/download-artifact@v4
        with:
          name: nextplan-v0.1.3-windows-final
          path: release-final
          github-token: ${{ github.token }}
          repository: changxinjiresearch/LifeOS-App
          run-id: ${{ env.FINAL_RUN_ID }}

      - name: Download exact v0.1.2 predecessor for upgrade acceptance
        uses: actions/download-artifact@v4
        with:
          name: nextplan-v0.1.2-windows-acceptance
          path: release-v012
          github-token: ${{ github.token }}
          repository: changxinjiresearch/LifeOS-App
          run-id: ${{ env.V012_RUN_ID }}

      - name: Verify immutable release identity and shipped Bridge
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          $installer=(Resolve-Path 'release-final/NextPlan-Setup-v0.1.3.exe').Path
          $bridge=(Resolve-Path 'release-final/NextPlan-Local-Bridge-v0.1.3-Windows.zip').Path
          $ih=(Get-FileHash $installer -Algorithm SHA256).Hash.ToLower()
          $bh=(Get-FileHash $bridge -Algorithm SHA256).Hash.ToLower()
          if($ih -ne $env:EXPECTED_INSTALLER_SHA){throw "installer SHA mismatch: $ih"}
          if($bh -ne $env:EXPECTED_BRIDGE_SHA){throw "bridge SHA mismatch: $bh"}
          Expand-Archive $bridge -DestinationPath bridge-final -Force
          $manifest=Get-Content bridge-final/manifest.json -Raw | ConvertFrom-Json
          if($manifest.version -ne '0.1.3'){throw 'Bridge version mismatch'}
          if(-not (Test-Path bridge-final/background.js) -or -not (Test-Path bridge-final/content.js)){throw 'Bridge package incomplete'}
          node --check bridge-final/background.js
          node --check bridge-final/content.js
          node --check scripts/windows_final_comprehensive_acceptance.js
          node --check scripts/windows_final_content_dom_acceptance.js
          node --check scripts/windows_final_ui_acceptance.js
          $meta=Get-Content release-final/BUILD-METADATA.txt -Raw
          foreach($needle in @('zero_dependency_acceptance=PASS','project_status_update=PASS','calendar_write=PASS','restart_persistence=PASS','secure_browser_bootstrap=PASS')){if($meta -notmatch [regex]::Escape($needle)){throw "missing prior release gate: $needle"}}
          $ui=Get-Content release-final/web-ui-source.json -Raw | ConvertFrom-Json
          if($ui.source_index_sha256 -ne $env:EXPECTED_UI_SHA){throw 'release UI source hash mismatch'}
          Write-Host WINDOWS_FINAL_RELEASE_IDENTITY_PASS

      - name: Verify shared UI logic and ChatGPT DOM bridge capture
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          $env:NEXTPLAN_WEB_UI_REF='main'
          python scripts/sync_web_ui_to_desktop.py
          node scripts/windows_final_ui_acceptance.js
          node scripts/windows_final_content_dom_acceptance.js
          Write-Host WINDOWS_FINAL_UI_AND_DOM_PASS

      - name: Real v0.1.2 to v0.1.3 upgrade then comprehensive installed-product acceptance
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          function Stop-NextPlan {
            Get-Process 'nextplan-local-desktop' -ErrorAction SilentlyContinue | Stop-Process -Force -ErrorAction SilentlyContinue
            Get-NetTCPConnection -LocalPort 47123,47124 -State Listen -ErrorAction SilentlyContinue | ForEach-Object {Stop-Process -Id $_.OwningProcess -Force -ErrorAction SilentlyContinue}
            Start-Sleep 2
          }
          function Find-Desktop {
            $d=Get-ChildItem $env:LOCALAPPDATA -Filter 'nextplan-local-desktop.exe' -File -Recurse -ErrorAction SilentlyContinue | Sort-Object LastWriteTime -Descending | Select-Object -First 1
            if(-not $d){throw 'installed NextPlan desktop missing'}
            return $d
          }
          function Start-CleanDesktop {
            param([string]$Exe)
            $old=$env:PATH
            try {
              $env:PATH="$env:SystemRoot\System32;$env:SystemRoot"
              $env:NEXTPLAN_LOCAL_PYTHON='C:\definitely-not-python\python.exe'
              $env:PYTHONHOME='C:\definitely-not-python'
              $env:PYTHONPATH='C:\definitely-not-python'
              $env:NODE_PATH='C:\definitely-not-node'
              return Start-Process $Exe -PassThru
            } finally {
              $env:PATH=$old
              Remove-Item Env:NEXTPLAN_LOCAL_PYTHON -ErrorAction SilentlyContinue
              Remove-Item Env:PYTHONHOME -ErrorAction SilentlyContinue
              Remove-Item Env:PYTHONPATH -ErrorAction SilentlyContinue
              Remove-Item Env:NODE_PATH -ErrorAction SilentlyContinue
            }
          }
          function Wait-Healthy {
            for($i=0;$i -lt 75;$i++){try{$h=Invoke-RestMethod http://127.0.0.1:47123/healthz -TimeoutSec 2;if($h.status -eq 'ok'){return $h}}catch{};Start-Sleep 1}
            throw 'Local Core did not become healthy'
          }
          function Bootstrap {
            $origin="chrome-extension://$env:OFFICIAL_EXTENSION_ID"
            return Invoke-RestMethod -Method Post -Uri http://127.0.0.1:47124/bridge/bootstrap -Headers @{Origin=$origin;'X-NextPlan-Extension-Id'=$env:OFFICIAL_EXTENSION_ID} -ContentType application/json -Body '{}'
          }
          function Read-State($token) {
            $origin="chrome-extension://$env:OFFICIAL_EXTENSION_ID"
            return Invoke-RestMethod http://127.0.0.1:47123/state -Headers @{Origin=$origin;Authorization="Bearer $token"}
          }

          Stop-NextPlan
          $oldInstaller=(Resolve-Path 'release-v012/NextPlan-Setup-v0.1.2.exe').Path
          $p=Start-Process $oldInstaller -ArgumentList '/S' -Wait -PassThru
          if($p.ExitCode -ne 0){throw 'v0.1.2 installation failed'}
          $desktop=Find-Desktop
          $app=Start-CleanDesktop $desktop.FullName
          $h=Wait-Healthy
          if($h.runtime -ne 'nextplan-local-core-v4'){throw "unexpected old runtime $($h.runtime)"}
          $b=Bootstrap
          $origin="chrome-extension://$env:OFFICIAL_EXTENSION_ID"
          $body=@{action=@{action='create_project';name='UPGRADE SENTINEL';category='其他';priority=1;next_action='survive upgrade'}} | ConvertTo-Json -Depth 8
          $receipt=Invoke-RestMethod -Method Post http://127.0.0.1:47123/actions/execute -Headers @{Origin=$origin;Authorization="Bearer $($b.token)"} -ContentType application/json -Body $body
          if(-not $receipt.status){throw 'could not create upgrade sentinel on v0.1.2'}
          Stop-NextPlan

          $installer=(Resolve-Path 'release-final/NextPlan-Setup-v0.1.3.exe').Path
          $p=Start-Process $installer -ArgumentList '/S' -Wait -PassThru
          if($p.ExitCode -ne 0){throw 'v0.1.3 upgrade installation failed'}
          $desktop=Find-Desktop
          $bytes=[IO.File]::ReadAllBytes($desktop.FullName)
          $peOffset=[BitConverter]::ToInt32($bytes,0x3c)
          $subsystem=[BitConverter]::ToUInt16($bytes,$peOffset+24+68)
          if($subsystem -ne 2){throw "installed desktop PE subsystem is $subsystem instead of GUI(2)"}
          $app=Start-CleanDesktop $desktop.FullName
          $h=Wait-Healthy
          if($h.runtime -ne 'nextplan-local-core-v4' -or -not $h.integrity.ok){throw 'v0.1.3 runtime/integrity failed'}
          $b=Bootstrap
          $s=Read-State $b.token
          if(-not ($s.projects | Where-Object {$_.name -eq 'UPGRADE SENTINEL'})){throw 'v0.1.2 data was lost during v0.1.3 upgrade'}
          $maintenance=Invoke-RestMethod http://127.0.0.1:47123/maintenance/status -Headers @{Origin=$origin;Authorization="Bearer $($b.token)"}
          $dataDir=[IO.Path]::GetFullPath($maintenance.data_dir)
          $installDir=[IO.Path]::GetFullPath($desktop.DirectoryName)
          if($dataDir.StartsWith($installDir,[StringComparison]::OrdinalIgnoreCase)){throw 'canonical SQLite data is inside installation directory'}
          Set-Content windows-final-data-dir.txt $dataDir

          $workspace=Join-Path $env:RUNNER_TEMP 'nextplan-final-workspace'
          New-Item -ItemType Directory $workspace -Force | Out-Null
          $fixture=Join-Path $workspace 'fixture.txt'
          Set-Content $fixture 'NextPlan Windows final acceptance fixture'
          $env:BRIDGE_DIR=(Resolve-Path 'bridge-final').Path
          $env:NP_WORKSPACE=$workspace
          $env:NP_ARTIFACT=$fixture
          $env:NP_RESULT_FILE=(Join-Path $PWD 'windows-final-results.json')
          $env:NP_EXPECT_PERSIST_FILE=(Join-Path $PWD 'windows-final-persist.json')
          node scripts/windows_final_comprehensive_acceptance.js
          if($LASTEXITCODE -ne 0){throw 'comprehensive installed-product acceptance failed'}

          $b=Bootstrap
          $raw=Read-State $b.token
          $raw | ConvertTo-Json -Depth 100 | Set-Content raw-state.json -Encoding UTF8
          node scripts/v013_adapter_acceptance.js
          if($LASTEXITCODE -ne 0){throw 'Desktop adapter acceptance failed'}
          Write-Host WINDOWS_FINAL_INSTALLED_PRODUCT_PASS

      - name: Restart, corruption recovery, repair install, uninstall and reinstall lifecycle
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          function Stop-Ports {Get-NetTCPConnection -LocalPort 47123,47124 -State Listen -ErrorAction SilentlyContinue | ForEach-Object {Stop-Process -Id $_.OwningProcess -Force -ErrorAction SilentlyContinue};Start-Sleep 2}
          function Find-Desktop {$d=Get-ChildItem $env:LOCALAPPDATA -Filter 'nextplan-local-desktop.exe' -File -Recurse -ErrorAction SilentlyContinue | Sort-Object LastWriteTime -Descending | Select-Object -First 1;if(-not $d){throw 'desktop missing'};return $d}
          function Start-Clean($exe){$old=$env:PATH;try{$env:PATH="$env:SystemRoot\System32;$env:SystemRoot";$env:NEXTPLAN_LOCAL_PYTHON='C:\definitely-not-python\python.exe';return Start-Process $exe -PassThru}finally{$env:PATH=$old;Remove-Item Env:NEXTPLAN_LOCAL_PYTHON -ErrorAction SilentlyContinue}}
          function Wait-Health {for($i=0;$i -lt 75;$i++){try{$h=Invoke-RestMethod http://127.0.0.1:47123/healthz -TimeoutSec 2;if($h.status -eq 'ok'){return $h}}catch{};Start-Sleep 1};throw 'health timeout'}
          function Bootstrap {$o="chrome-extension://$env:OFFICIAL_EXTENSION_ID";Invoke-RestMethod -Method Post http://127.0.0.1:47124/bridge/bootstrap -Headers @{Origin=$o;'X-NextPlan-Extension-Id'=$env:OFFICIAL_EXTENSION_ID} -ContentType application/json -Body '{}'}
          function Read-State($t){$o="chrome-extension://$env:OFFICIAL_EXTENSION_ID";Invoke-RestMethod http://127.0.0.1:47123/state -Headers @{Origin=$o;Authorization="Bearer $t"}}
          function Verify-Sentinel {$b=Bootstrap;$s=Read-State $b.token;$want=Get-Content windows-final-persist.json -Raw|ConvertFrom-Json;$p=$s.projects|Where-Object {$_.id -eq $want.id -and $_.name -eq $want.name}|Select-Object -First 1;if(-not $p){throw 'FINAL PERSISTENCE SENTINEL missing'};return $b}

          $desktop=Find-Desktop
          $proc=Get-Process 'nextplan-local-desktop' -ErrorAction SilentlyContinue | Select-Object -First 1
          if($proc){$null=$proc.CloseMainWindow();if(-not $proc.WaitForExit(10000)){Stop-Process -Id $proc.Id -Force}}
          for($i=0;$i -lt 20;$i++){if(-not (Get-NetTCPConnection -LocalPort 47123,47124 -State Listen -ErrorAction SilentlyContinue)){break};Start-Sleep -Milliseconds 500}
          if(Get-NetTCPConnection -LocalPort 47123,47124 -State Listen -ErrorAction SilentlyContinue){throw 'Local Core/Bridge ports remained open after app exit'}
          Write-Host WINDOWS_FINAL_GRACEFUL_EXIT_PASS

          $app=Start-Clean $desktop.FullName
          $h=Wait-Health
          $b=Verify-Sentinel
          Write-Host WINDOWS_FINAL_RESTART_PERSISTENCE_PASS

          $dataDir=(Get-Content windows-final-data-dir.txt -Raw).Trim()
          $db=Join-Path $dataDir 'nextplan.db'
          if(-not (Test-Path $db)){throw 'canonical DB missing before corruption recovery test'}
          Get-Process 'nextplan-local-desktop' -ErrorAction SilentlyContinue | Stop-Process -Force -ErrorAction SilentlyContinue
          Stop-Ports
          Remove-Item "$db-wal","$db-shm" -Force -ErrorAction SilentlyContinue
          [IO.File]::WriteAllBytes($db,[Text.Encoding]::UTF8.GetBytes('not-a-sqlite-database-for-final-recovery-test'))
          $desktop=Find-Desktop
          $app=Start-Clean $desktop.FullName
          $h=Wait-Health
          if(-not $h.integrity.ok -or -not $h.integrity.recovered_on_startup){throw 'verified checkpoint corruption recovery did not activate'}
          $b=Verify-Sentinel
          Write-Host WINDOWS_FINAL_CORRUPTION_RECOVERY_PASS

          Get-Process 'nextplan-local-desktop' -ErrorAction SilentlyContinue | Stop-Process -Force -ErrorAction SilentlyContinue
          Stop-Ports
          $installer=(Resolve-Path 'release-final/NextPlan-Setup-v0.1.3.exe').Path
          $p=Start-Process $installer -ArgumentList '/S' -Wait -PassThru
          if($p.ExitCode -ne 0){throw 'same-version repair install failed'}
          $desktop=Find-Desktop
          $app=Start-Clean $desktop.FullName
          $h=Wait-Health
          $b=Verify-Sentinel
          Write-Host WINDOWS_FINAL_REPAIR_INSTALL_PERSISTENCE_PASS

          Get-Process 'nextplan-local-desktop' -ErrorAction SilentlyContinue | Stop-Process -Force -ErrorAction SilentlyContinue
          Stop-Ports
          $uninstaller=Get-ChildItem $desktop.DirectoryName -Filter 'uninstall*.exe' -File -ErrorAction SilentlyContinue | Select-Object -First 1
          if(-not $uninstaller){throw 'NSIS uninstaller missing'}
          $p=Start-Process $uninstaller.FullName -ArgumentList '/S' -Wait -PassThru
          if($p.ExitCode -ne 0){throw 'silent uninstall failed'}
          if(-not (Test-Path $db)){throw 'uninstall removed canonical user database'}
          $p=Start-Process $installer -ArgumentList '/S' -Wait -PassThru
          if($p.ExitCode -ne 0){throw 'reinstall after uninstall failed'}
          $desktop=Find-Desktop
          $app=Start-Clean $desktop.FullName
          $h=Wait-Health
          $b=Verify-Sentinel
          Write-Host WINDOWS_FINAL_UNINSTALL_REINSTALL_PERSISTENCE_PASS
          Get-Process 'nextplan-local-desktop' -ErrorAction SilentlyContinue | Stop-Process -Force -ErrorAction SilentlyContinue
          Stop-Ports

      - name: Write final evidence manifest
        if: always()
        shell: pwsh
        run: |
          $result='UNKNOWN'
          if(Test-Path windows-final-results.json){$r=Get-Content windows-final-results.json -Raw|ConvertFrom-Json;$result=$r.status}
          @(
            'release=NextPlan Windows v0.1.3',
            "installer_sha256=$env:EXPECTED_INSTALLER_SHA",
            "bridge_sha256=$env:EXPECTED_BRIDGE_SHA",
            "canonical_ui_sha256=$env:EXPECTED_UI_SHA",
            "comprehensive_runtime_result=$result",
            "runner=$env:RUNNER_OS $env:RUNNER_ARCH",
            "source_branch=$env:GITHUB_REF_NAME",
            "source_sha=$env:GITHUB_SHA"
          ) | Set-Content WINDOWS-FINAL-ACCEPTANCE.txt

      - name: Upload comprehensive acceptance evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nextplan-v0.1.3-windows-comprehensive-final-evidence
          path: |
            WINDOWS-FINAL-ACCEPTANCE.txt
            windows-final-results.json
            windows-final-persist.json
            windows-final-data-dir.txt
            raw-state.json
            desktop_local/ui/web-ui-source.json
          if-no-files-found: warn
          retention-days: 30

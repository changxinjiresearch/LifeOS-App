name: NextPlan Jarvis Web acceptance

on:
  pull_request:
    branches: [main]
    paths:
      - 'index.html'
      - 'jarvis.html'
      - 'jarvis-client.js'
      - 'jarvis.css'
      - '.github/workflows/jarvis-web-acceptance.yml'
  push:
    branches: [main, 'feature/nextplan-jarvis-web']
    paths:
      - 'index.html'
      - 'jarvis.html'
      - 'jarvis-client.js'
      - 'jarvis.css'
      - '.github/workflows/jarvis-web-acceptance.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  web-acceptance:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Browser module syntax
        run: node --check jarvis-client.js
      - name: NextPlan single UI authority and Jarvis safe wiring
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          html = Path('index.html').read_text(encoding='utf-8')
          page = Path('jarvis.html').read_text(encoding='utf-8')
          js = Path('jarvis-client.js').read_text(encoding='utf-8')
          assert 'href="./jarvis.html"' in html
          assert 'jarvis-client.js' in page
          assert 'jarvis.css' in page
          assert 'Content-Security-Policy' in page
          assert 'id="jarvisToken" type="password"' in page
          assert "sessionStorage" in js
          assert "confirm(" in js
          assert "NEXTPLAN_JARVIS_SESSION_TOKEN" in js
          assert 'raw.githubusercontent.com/changxinjiresearch/LifeOS/main/state.json' in js
          assert '<script' not in js
          assert not re.search(r'(ghp_|sk-proj-)[A-Za-z0-9]{10,}', js)
          assert 'data-view="home"' in html
          print('NextPlan Jarvis Web wiring and no hardcoded credentials PASS')
          PY

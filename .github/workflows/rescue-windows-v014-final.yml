name: NextPlan Windows v0.1.4 Release Final

on:
  workflow_dispatch:
  push:
    branches: [final-windows-v013-comprehensive]
    paths:
      - '.github/workflows/rescue-windows-v014-final.yml'
      - 'scripts/v014_*.js'
      - 'scripts/windows_final_content_dom_acceptance.js'
      - 'scripts/windows_final_comprehensive_acceptance.js'
      - 'chrome_extension_local/**'
      - 'desktop_local/**'

permissions:
  actions: read
  contents: read

env:
  SEED_RUN_ID: '34742831144'
  PREDECESSOR_RUN_ID: '34770165887'
  VERSION: '0.1.4'
  UI_REF: '140df66e9582ab98894fd8d9a368d8ca4630f6c8'
  OFFICIAL_EXTENSION_ID: 'gbdcbnbdmkgjffjioohjfidjmchiggpc'

jobs:
  windows-v014-release-final:
    runs-on: windows-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: dtolnay/rust-toolchain@stable
      - name: Install test-only UI dependency
        shell: pwsh
        run: npm install --no-save jsdom@24

      - name: Download verified unchanged Local Core seed
        uses: actions/download-artifact@v4
        with:
          name: rescue-old-windows-release
          path: old-seed
          github-token: ${{ github.token }}
          repository: changxinjiresearch/LifeOS-App
          run-id: ${{ env.SEED_RUN_ID }}

      - name: Download v0.1.3 predecessor for upgrade acceptance
        uses: actions/download-artifact@v4
        with:
          name: nextplan-v0.1.3-windows-final
          path: predecessor
          github-token: ${{ github.token }}
          repository: changxinjiresearch/LifeOS-App
          run-id: ${{ env.PREDECESSOR_RUN_ID }}

      - name: Recover Local Core and prepare immutable UI + Bridge
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          Expand-Archive 'old-seed/old-windows-release.zip' -DestinationPath 'old-release' -Force
          $oldInstaller=Get-ChildItem old-release -Filter '*.exe' -File -Recurse | Select-Object -First 1
          if(-not $oldInstaller){throw 'seed installer missing'}
          $p=Start-Process $oldInstaller.FullName -ArgumentList '/S' -Wait -PassThru
          if($p.ExitCode -ne 0){throw 'seed installer failed'}
          $core=Get-ChildItem $env:LOCALAPPDATA -Filter 'nextplan-core.exe' -File -Recurse -ErrorAction SilentlyContinue | Select-Object -First 1
          if(-not $core){throw 'verified nextplan-core.exe not found'}
          New-Item -ItemType Directory 'desktop_local/src-tauri/resources' -Force | Out-Null
          Copy-Item $core.FullName 'desktop_local/src-tauri/resources/nextplan-core.exe' -Force
          $env:NEXTPLAN_WEB_UI_REF=$env:UI_REF
          python scripts/sync_web_ui_to_desktop.py
          if($LASTEXITCODE -ne 0){throw 'UI sync failed'}
          npx --yes @tauri-apps/cli@2 icon icon.svg --output desktop_local/src-tauri/icons
          foreach($f in @('chrome_extension_local/background.js','chrome_extension_local/content.js','desktop_local/ui/desktop-adapter.js','scripts/v014_background_acceptance.js','scripts/v014_adapter_acceptance.js','scripts/v014_ui_acceptance.js','scripts/windows_final_content_dom_acceptance.js','scripts/windows_final_comprehensive_acceptance.js')){node --check $f;if($LASTEXITCODE -ne 0){throw "syntax check failed: $f"}}
          $m=Get-Content chrome_extension_local/manifest.json -Raw|ConvertFrom-Json
          if($m.version -ne '0.1.4'){throw 'Bridge manifest is not v0.1.4'}
          $bg=Get-Content chrome_extension_local/background.js -Raw
          foreach($needle in @('__NP_CAL_V1__:','__NP_NOTE_V1__:','__NP_RESOURCE_V1__:','__NP_AUT_V1__:','bridgeVersion:"0.1.4"')){if($bg -notlike "*$needle*"){throw "Bridge parity contract missing: $needle"}}
          $content=Get-Content chrome_extension_local/content.js -Raw
          if($content -notmatch 'const inflight = new Set'){throw 'retry-safe inflight contract missing'}
          if($content -match 'seen\.add\(fingerprint\)'){throw 'eager seen bug returned'}
          Write-Host V014_SOURCE_CONTRACT_PASS

      - name: Canonical UI and ChatGPT DOM acceptance
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          $env:BRIDGE_DIR=(Resolve-Path 'chrome_extension_local').Path
          node scripts/v014_ui_acceptance.js
          if($LASTEXITCODE -ne 0){throw 'canonical UI acceptance failed'}
          node scripts/windows_final_content_dom_acceptance.js
          if($LASTEXITCODE -ne 0){throw 'ChatGPT DOM acceptance failed'}
          Write-Host V014_UI_DOM_PASS

      - name: Build Windows GUI installer
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          cargo check --manifest-path desktop_local/src-tauri/Cargo.toml
          if($LASTEXITCODE -ne 0){throw 'cargo check failed'}
          npx --yes @tauri-apps/cli@2 build --bundles nsis --config desktop_local/src-tauri/tauri.conf.json
          if($LASTEXITCODE -ne 0){throw 'Tauri build failed'}
          $desktop=(Resolve-Path 'desktop_local/src-tauri/target/release/nextplan-local-desktop.exe').Path
          $bytes=[IO.File]::ReadAllBytes($desktop);$pe=[BitConverter]::ToInt32($bytes,0x3c);$sub=[BitConverter]::ToUInt16($bytes,$pe+24+68)
          if($sub -ne 2){throw "desktop PE subsystem is $sub, expected GUI (2)"}
          $rust=Get-Content desktop_local/src-tauri/src/main.rs -Raw
          if($rust -notmatch 'CREATE_NO_WINDOW'){throw 'hidden Local Core process flag missing'}
          $installer=Get-ChildItem 'desktop_local/src-tauri/target/release/bundle/nsis' -Filter '*.exe' | Select-Object -First 1
          if(-not $installer){throw 'NSIS installer missing'}
          New-Item -ItemType Directory release -Force | Out-Null
          Copy-Item $installer.FullName "release/NextPlan-Setup-v$env:VERSION.exe" -Force
          Compress-Archive -Path 'chrome_extension_local/*' -DestinationPath "release/NextPlan-Local-Bridge-v$env:VERSION-Windows.zip" -Force
          Copy-Item desktop_local/ui/web-ui-source.json release/web-ui-source.json
          Write-Host V014_BUILD_PASS

      - name: Upgrade v0.1.3 to v0.1.4 and run full installed-product matrix
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          function Stop-NextPlan {
            Get-Process 'nextplan-local-desktop' -ErrorAction SilentlyContinue | Stop-Process -Force -ErrorAction SilentlyContinue
            Get-NetTCPConnection -LocalPort 47123,47124 -State Listen -ErrorAction SilentlyContinue | ForEach-Object {Stop-Process -Id $_.OwningProcess -Force -ErrorAction SilentlyContinue}
            Start-Sleep 2
          }
          function Find-Desktop {
            $d=Get-ChildItem $env:LOCALAPPDATA -Filter 'nextplan-local-desktop.exe' -File -Recurse -ErrorAction SilentlyContinue | Sort-Object LastWriteTime -Descending | Select-Object -First 1
            if(-not $d){throw 'installed desktop missing'}
            return $d
          }
          function Start-Clean([string]$exe) {
            $old=$env:PATH
            try {
              $env:PATH="$env:SystemRoot\System32;$env:SystemRoot"
              $env:NEXTPLAN_LOCAL_PYTHON='C:\not-python\python.exe'
              $env:PYTHONHOME='C:\not-python'
              $env:PYTHONPATH='C:\not-python'
              $env:NODE_PATH='C:\not-node'
              return Start-Process $exe -PassThru
            } finally {
              $env:PATH=$old
              Remove-Item Env:NEXTPLAN_LOCAL_PYTHON,Env:PYTHONHOME,Env:PYTHONPATH,Env:NODE_PATH -ErrorAction SilentlyContinue
            }
          }
          function Wait-Health {
            for($i=0;$i -lt 75;$i++){try{$h=Invoke-RestMethod http://127.0.0.1:47123/healthz -TimeoutSec 2;if($h.status -eq 'ok'){return $h}}catch{};Start-Sleep 1}
            throw 'Local Core health timeout'
          }
          function Bootstrap {
            $o="chrome-extension://$env:OFFICIAL_EXTENSION_ID"
            Invoke-RestMethod -Method Post http://127.0.0.1:47124/bridge/bootstrap -Headers @{Origin=$o;'X-NextPlan-Extension-Id'=$env:OFFICIAL_EXTENSION_ID} -ContentType application/json -Body '{}'
          }
          function Read-State($t) {
            $o="chrome-extension://$env:OFFICIAL_EXTENSION_ID"
            Invoke-RestMethod http://127.0.0.1:47123/state -Headers @{Origin=$o;Authorization="Bearer $t"}
          }
          Stop-NextPlan
          $pred=(Resolve-Path 'predecessor/NextPlan-Setup-v0.1.3.exe').Path
          $p=Start-Process $pred -ArgumentList '/S' -Wait -PassThru;if($p.ExitCode -ne 0){throw 'v0.1.3 install failed'}
          $desktop=Find-Desktop;$app=Start-Clean $desktop.FullName;$h=Wait-Health;$b=Bootstrap
          $o="chrome-extension://$env:OFFICIAL_EXTENSION_ID"
          $body=@{action=@{action='create_project';name='UPGRADE V013 SENTINEL';category='其他';priority=1;next_action='survive v014'}}|ConvertTo-Json -Depth 8
          Invoke-RestMethod -Method Post http://127.0.0.1:47123/actions/execute -Headers @{Origin=$o;Authorization="Bearer $($b.token)"} -ContentType application/json -Body $body | Out-Null
          Stop-NextPlan
          $installer=(Resolve-Path "release/NextPlan-Setup-v$env:VERSION.exe").Path
          $p=Start-Process $installer -ArgumentList '/S' -Wait -PassThru;if($p.ExitCode -ne 0){throw 'v0.1.4 upgrade failed'}
          $desktop=Find-Desktop;$app=Start-Clean $desktop.FullName;$h=Wait-Health
          if($h.runtime -ne 'nextplan-local-core-v4' -or -not $h.integrity.ok){throw 'runtime/integrity failed'}
          $b=Bootstrap;$s=Read-State $b.token
          if(-not ($s.projects|Where-Object {$_.name -eq 'UPGRADE V013 SENTINEL'})){throw 'upgrade lost v0.1.3 user state'}
          $maintenance=Invoke-RestMethod http://127.0.0.1:47123/maintenance/status -Headers @{Origin=$o;Authorization="Bearer $($b.token)"}
          $dataDir=[IO.Path]::GetFullPath($maintenance.data_dir);$installDir=[IO.Path]::GetFullPath($desktop.DirectoryName)
          if($dataDir.StartsWith($installDir,[StringComparison]::OrdinalIgnoreCase)){throw 'SQLite data lives inside install directory'}
          Set-Content v014-data-dir.txt $dataDir
          $env:NEXTPLAN_TEST_TOKEN=$b.token
          node scripts/v014_background_acceptance.js
          if($LASTEXITCODE -ne 0){throw 'v0.1.4 Bridge chain failed'}
          node scripts/v014_adapter_acceptance.js
          if($LASTEXITCODE -ne 0){throw 'v0.1.4 adapter parity failed'}
          Copy-Item scripts/windows_final_comprehensive_acceptance.js scripts/v014_comprehensive_runtime.js -Force
          (Get-Content scripts/v014_comprehensive_runtime.js -Raw).Replace("status.version === '0.1.3'","status.version === '0.1.4'").Replace("bridge.status_connected_v013","bridge.status_connected_v014") | Set-Content scripts/v014_comprehensive_runtime.js -Encoding UTF8
          node --check scripts/v014_comprehensive_runtime.js
          $workspace=Join-Path $env:RUNNER_TEMP 'nextplan-v014-workspace';New-Item -ItemType Directory $workspace -Force|Out-Null
          $fixture=Join-Path $workspace 'fixture.txt';Set-Content $fixture 'NextPlan Windows v0.1.4 release acceptance fixture'
          $env:BRIDGE_DIR=(Resolve-Path 'chrome_extension_local').Path;$env:NP_WORKSPACE=$workspace;$env:NP_ARTIFACT=$fixture
          $env:NP_RESULT_FILE=(Join-Path $PWD 'v014-comprehensive-results.json');$env:NP_EXPECT_PERSIST_FILE=(Join-Path $PWD 'v014-persist.json')
          node scripts/v014_comprehensive_runtime.js
          if($LASTEXITCODE -ne 0){throw 'comprehensive installed-product matrix failed'}
          Write-Host V014_INSTALLED_PRODUCT_FULL_MATRIX_PASS

      - name: Restart, recovery, repair, uninstall/reinstall lifecycle acceptance
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          function Stop-Ports {Get-NetTCPConnection -LocalPort 47123,47124 -State Listen -ErrorAction SilentlyContinue|ForEach-Object{Stop-Process -Id $_.OwningProcess -Force -ErrorAction SilentlyContinue};Start-Sleep 2}
          function Find-Desktop {$d=Get-ChildItem $env:LOCALAPPDATA -Filter 'nextplan-local-desktop.exe' -File -Recurse -ErrorAction SilentlyContinue|Sort-Object LastWriteTime -Descending|Select-Object -First 1;if(-not $d){throw 'desktop missing'};return $d}
          function Start-Clean($exe){$old=$env:PATH;try{$env:PATH="$env:SystemRoot\System32;$env:SystemRoot";$env:NEXTPLAN_LOCAL_PYTHON='C:\not-python\python.exe';return Start-Process $exe -PassThru}finally{$env:PATH=$old;Remove-Item Env:NEXTPLAN_LOCAL_PYTHON -ErrorAction SilentlyContinue}}
          function Wait-Health {for($i=0;$i -lt 75;$i++){try{$h=Invoke-RestMethod http://127.0.0.1:47123/healthz -TimeoutSec 2;if($h.status -eq 'ok'){return $h}}catch{};Start-Sleep 1};throw 'health timeout'}
          function Bootstrap {$o="chrome-extension://$env:OFFICIAL_EXTENSION_ID";Invoke-RestMethod -Method Post http://127.0.0.1:47124/bridge/bootstrap -Headers @{Origin=$o;'X-NextPlan-Extension-Id'=$env:OFFICIAL_EXTENSION_ID} -ContentType application/json -Body '{}'}
          function State($t){$o="chrome-extension://$env:OFFICIAL_EXTENSION_ID";Invoke-RestMethod http://127.0.0.1:47123/state -Headers @{Origin=$o;Authorization="Bearer $t"}}
          function Verify-Sentinel {$b=Bootstrap;$s=State $b.token;$want=Get-Content v014-persist.json -Raw|ConvertFrom-Json;if(-not ($s.projects|Where-Object {$_.id -eq $want.id -and $_.name -eq $want.name})){throw 'persistence sentinel missing'};return $b}
          $desktop=Find-Desktop
          $proc=Get-Process 'nextplan-local-desktop' -ErrorAction SilentlyContinue|Select-Object -First 1
          if($proc){$null=$proc.CloseMainWindow();if(-not $proc.WaitForExit(10000)){Stop-Process -Id $proc.Id -Force}}
          for($i=0;$i -lt 20;$i++){if(-not (Get-NetTCPConnection -LocalPort 47123,47124 -State Listen -ErrorAction SilentlyContinue)){break};Start-Sleep -Milliseconds 500}
          if(Get-NetTCPConnection -LocalPort 47123,47124 -State Listen -ErrorAction SilentlyContinue){throw 'ports remain after app exit'}
          $desktop=Find-Desktop;$app=Start-Clean $desktop.FullName;$h=Wait-Health;$b=Verify-Sentinel
          $env:NEXTPLAN_TEST_TOKEN=$b.token
          node scripts/v014_adapter_acceptance.js
          if($LASTEXITCODE -ne 0){throw 'compat feature state lost after restart'}
          Write-Host V014_RESTART_PERSISTENCE_PASS
          $dataDir=(Get-Content v014-data-dir.txt -Raw).Trim();$db=Join-Path $dataDir 'nextplan.db'
          Get-Process 'nextplan-local-desktop' -ErrorAction SilentlyContinue|Stop-Process -Force -ErrorAction SilentlyContinue;Stop-Ports
          Remove-Item "$db-wal","$db-shm" -Force -ErrorAction SilentlyContinue
          [IO.File]::WriteAllBytes($db,[Text.Encoding]::UTF8.GetBytes('corrupt-for-v014-recovery-test'))
          $desktop=Find-Desktop;$app=Start-Clean $desktop.FullName;$h=Wait-Health
          if(-not $h.integrity.ok -or -not $h.integrity.recovered_on_startup){throw 'corruption recovery failed'}
          $b=Verify-Sentinel
          Write-Host V014_CORRUPTION_RECOVERY_PASS
          Get-Process 'nextplan-local-desktop' -ErrorAction SilentlyContinue|Stop-Process -Force -ErrorAction SilentlyContinue;Stop-Ports
          $installer=(Resolve-Path "release/NextPlan-Setup-v$env:VERSION.exe").Path
          $p=Start-Process $installer -ArgumentList '/S' -Wait -PassThru;if($p.ExitCode -ne 0){throw 'repair install failed'}
          $desktop=Find-Desktop;$app=Start-Clean $desktop.FullName;$h=Wait-Health;$b=Verify-Sentinel
          Write-Host V014_REPAIR_INSTALL_PASS
          Get-Process 'nextplan-local-desktop' -ErrorAction SilentlyContinue|Stop-Process -Force -ErrorAction SilentlyContinue;Stop-Ports
          $un=Get-ChildItem $desktop.DirectoryName -Filter 'uninstall*.exe' -File|Select-Object -First 1;if(-not $un){throw 'uninstaller missing'}
          $p=Start-Process $un.FullName -ArgumentList '/S' -Wait -PassThru;if($p.ExitCode -ne 0){throw 'uninstall failed'}
          if(-not (Test-Path $db)){throw 'uninstall deleted user DB'}
          $p=Start-Process $installer -ArgumentList '/S' -Wait -PassThru;if($p.ExitCode -ne 0){throw 'reinstall failed'}
          $desktop=Find-Desktop;$app=Start-Clean $desktop.FullName;$h=Wait-Health;$b=Verify-Sentinel
          Write-Host V014_UNINSTALL_REINSTALL_DATA_PASS
          Get-Process 'nextplan-local-desktop' -ErrorAction SilentlyContinue|Stop-Process -Force -ErrorAction SilentlyContinue;Stop-Ports

      - name: Package release evidence
        shell: pwsh
        run: |
          @(
            "canonical_web=changxinjiresearch/LifeOS-App@$env:UI_REF",
            'desktop_contract=windows-v0.1.4-release-final',
            'architecture=windows-x64',
            'zero_dependency_acceptance=PASS',
            'no_console=PASS',
            'secure_browser_bootstrap=PASS',
            'chatgpt_dom_capture=PASS',
            'project_crud=PASS',
            'task_crud_and_completion=PASS',
            'project_status=PASS',
            'calendar=PASS',
            'deadline=PASS',
            'notes=PASS',
            'resources=PASS',
            'automation=PASS',
            'destructive_confirmation=PASS',
            'weekly_review_ai_planning_search_analytics_ui=PASS',
            'workspace_artifact_local_execution=PASS',
            'backup_restore=PASS',
            'restart_persistence=PASS',
            'corruption_recovery=PASS',
            'repair_install=PASS',
            'uninstall_reinstall_data=PASS',
            'upgrade_from_v0.1.3=PASS'
          ) | Set-Content release/BUILD-METADATA.txt
          Get-FileHash release/* -Algorithm SHA256 | ForEach-Object {"$($_.Hash.ToLower())  $([IO.Path]::GetFileName($_.Path))"} | Set-Content release/SHA256SUMS.txt
          Copy-Item v014-comprehensive-results.json release/v014-comprehensive-results.json -ErrorAction SilentlyContinue
          Write-Host V014_RELEASE_EVIDENCE_PASS

      - uses: actions/upload-artifact@v4
        with:
          name: nextplan-v0.1.4-windows-release-final
          path: release/*
          if-no-files-found: error
          retention-days: 30

name: Maintain NextPlan Phase C UI

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify and maintain Phase B base UI
        run: python .github/scripts/phase_b_ui_maintain.py
      - name: Normalize Phase C maintainer
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('.github/scripts/phase_c_ui_maintain.py')
          s=p.read_text(encoding='utf-8')
          s=s.replace("r'^function renderSearch\\(q\\).*?$': render_search,", "r'function renderSearch\\(q\\).*?$': render_search,")
          p.write_text(s,encoding='utf-8')
          PY
      - name: Verify and maintain Phase C UI
        run: python .github/scripts/phase_c_ui_maintain.py
      - name: Commit normalized Phase C UI
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html sw.js .github/scripts/phase_c_ui_maintain.py
          if git diff --cached --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          git commit -m "Maintain NextPlan Phase C UI contract"
          git push

name: Refine Apple-style sidebar typography

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  refine:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Refine typography and settings icon
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')

          font_link='''<link rel="preconnect" href="https://fonts.googleapis.com">\n<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>\n<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;450;500;550;600;650;700&display=swap" rel="stylesheet">'''
          if 'fonts.googleapis.com/css2?family=Inter' not in s:
              s=s.replace('<link rel="icon" href="./icon.svg" type="image/svg+xml">', '<link rel="icon" href="./icon.svg" type="image/svg+xml">\n'+font_link, 1)

          old='font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display","SF Pro Text","Segoe UI","PingFang SC","Microsoft YaHei",sans-serif'
          new='font-family:"Inter",-apple-system,BlinkMacSystemFont,"SF Pro Text","SF Pro Display","Helvetica Neue","Segoe UI","PingFang SC","Microsoft YaHei",sans-serif'
          if old in s:
              s=s.replace(old,new,1)

          s=s.replace('.brand h1{font-size:20px;letter-spacing:-.35px;margin:0}', '.brand h1{font-size:20px;letter-spacing:-.5px;margin:0;font-weight:700}', 1)
          s=s.replace('.brand p{font-size:12px;color:var(--muted);margin:2px 0 0;line-height:1.25}', '.brand p{font-size:12px;color:var(--muted);margin:3px 0 0;line-height:1.3;font-weight:400;letter-spacing:-.01em}', 1)
          s=s.replace('font-weight:520;text-align:left}.nav-btn svg{width:17px;height:17px;color:#7d8798}', 'font-size:15px;font-weight:500;letter-spacing:-.015em;text-align:left}.nav-btn svg{width:19px;height:19px;color:#718096;stroke-width:1.75}', 1)
          s=s.replace('.nav-label{font-size:11px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);font-weight:650;', '.nav-label{font-size:11px;text-transform:uppercase;letter-spacing:.09em;color:var(--muted);font-weight:600;', 1)
          s=s.replace('.settings-btn{width:100%;display:flex;gap:10px;align-items:center;border:0;background:transparent;color:var(--muted);padding:9px 11px;border-radius:10px}', '.settings-btn{width:100%;display:flex;gap:10px;align-items:center;border:0;background:transparent;color:var(--muted);padding:9px 11px;border-radius:10px;font-size:15px;font-weight:500;letter-spacing:-.015em}.settings-btn svg{width:19px;height:19px;stroke-width:1.75;color:#718096}', 1)

          start='<button class="settings-btn" id="settingsNav"><svg viewBox="0 0 24 24"'
          i=s.find(start)
          if i!=-1:
              j=s.find('</button>',i)
              if j!=-1:
                  j+=len('</button>')
                  new_btn='''<button class="settings-btn" id="settingsNav"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .34 1.87l.05.05-2.12 2.12-.05-.05a1.7 1.7 0 0 0-1.87-.34 1.7 1.7 0 0 0-1.03 1.56V20h-3v-.08a1.7 1.7 0 0 0-1.03-1.56 1.7 1.7 0 0 0-1.87.34l-.05.05-2.12-2.12.05-.05A1.7 1.7 0 0 0 7.04 15a1.7 1.7 0 0 0-1.56-1.03H5.4v-3h.08A1.7 1.7 0 0 0 7.04 9.94a1.7 1.7 0 0 0-.34-1.87l-.05-.05L8.77 5.9l.05.05a1.7 1.7 0 0 0 1.87.34 1.7 1.7 0 0 0 1.03-1.56V4.65h3v.08a1.7 1.7 0 0 0 1.03 1.56 1.7 1.7 0 0 0 1.87-.34l.05-.05 2.12 2.12-.05.05a1.7 1.7 0 0 0-.34 1.87 1.7 1.7 0 0 0 1.56 1.03h.08v3h-.08A1.7 1.7 0 0 0 19.4 15z"/></svg>Settings</button>'''
                  s=s[:i]+new_btn+s[j:]

          # Bump service-worker registration URL to force an updated shell fetch without touching localStorage keys.
          s=s.replace("navigator.serviceWorker.register('./sw.js')", "navigator.serviceWorker.register('./sw.js?v=apple-sidebar-1')", 1)

          p.write_text(s,encoding='utf-8')
          PY
      - name: Commit refinement
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Refine Apple-style sidebar typography and settings icon"
          git push

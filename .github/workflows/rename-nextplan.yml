name: Rename app to NextPlan

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  rename:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Correct app name
        run: |
          python - <<'PY'
          from pathlib import Path
          for name in ['index.html', 'manifest.webmanifest']:
              p = Path(name)
              s = p.read_text(encoding='utf-8')
              s = s.replace('NextPlane', 'NextPlan')
              p.write_text(s, encoding='utf-8')
          p = Path('sw.js')
          if p.exists():
              s = p.read_text(encoding='utf-8')
              s = s.replace('nextplane-shell-v2', 'nextplan-shell-v3')
              p.write_text(s, encoding='utf-8')
          PY
      - name: Commit correction
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html manifest.webmanifest sw.js
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "Correct app name to NextPlan"
          git push
